<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learning Hub - Admin Module</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f6f8;
}

/* Login */
.login {
    width: 350px;
    margin: 100px auto;
    padding: 30px;
    background: white;
    border-radius: 10px;
    box-shadow: 0 4px 15px #bbb;
}

.login h2 {
    text-align: center;
    margin-bottom: 20px;
}

input, button {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border-radius: 5px;
    border: 1px solid #ccc;
}

button {
    background: #2563eb;
    color: white;
    border: none;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

/* Admin */
#admin {
    display: none;
}

header {
    background: #1e293b;
    color: white;
    padding: 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header button {
    width: auto;
    background: #ef4444;
    padding: 8px 15px;
}

.container {
    padding: 25px;
}

.cards {
    display: flex;
    gap: 20px;
    margin-bottom: 25px;
}

.card {
    background: white;
    padding: 25px;
    flex: 1;
    text-align: center;
    border-radius: 8px;
    box-shadow: 0 2px 8px #ddd;
}

.card h2 {
    color: #2563eb;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: white;
}

th, td {
    padding: 12px;
    border: 1px solid #ddd;
    text-align: center;
}

th {
    background: #2563eb;
    color: white;
}

.delete {
    background: #ef4444;
    width: auto;
    padding: 7px 12px;
}

.add-course {
    background: white;
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 8px;
}

@media(max-width:700px) {
    .cards {
        flex-direction: column;
    }

    .container {
        padding: 15px;
    }
}
</style>
</head>

<body>

<!-- Admin Login -->
<div class="login" id="login">
    <h2>Learning Hub Admin</h2>

    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">

    <button onclick="loginAdmin()">Login</button>
    <p id="error" style="color:red;text-align:center;"></p>
</div>

<!-- Admin Dashboard -->
<div id="admin">

<header>
    <h2>Learning Hub Admin</h2>
    <button onclick="logout()">Logout</button>
</header>

<div class="container">

    <div class="cards">
        <div class="card">
            <h3>Total Courses</h3>
            <h2 id="courseCount">0</h2>
        </div>

        <div class="card">
            <h3>Total Students</h3>
            <h2>120</h2>
        </div>

        <div class="card">
            <h3>Total Teachers</h3>
            <h2>15</h2>
        </div>
    </div>

    <!-- Add Course -->
    <div class="add-course">
        <h3>Add New Course</h3>

        <input type="text" id="courseName"
               placeholder="Course Name">

        <input type="text" id="teacher"
               placeholder="Teacher Name">

        <button onclick="addCourse()">Add Course</button>
    </div>

    <!-- Courses -->
    <h3>Manage Courses</h3>
    <br>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Course</th>
                <th>Teacher</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="courseTable"></tbody>
    </table>

</div>
</div>

<script>
let courses = JSON.parse(localStorage.getItem("courses")) || [
    {id: 1, name: "HTML & CSS", teacher: "John"},
    {id: 2, name: "Python Programming", teacher: "David"}
];

/* Login */
function loginAdmin() {
    let user = document.getElementById("username").value;
    let pass = document.getElementById("password").value;

    if (user === "admin" && pass === "1234") {
        document.getElementById("login").style.display = "none";
        document.getElementById("admin").style.display = "block";
        displayCourses();
    } else {
        document.getElementById("error").innerText =
            "Invalid username or password";
    }
}

/* Display Courses */
function displayCourses() {
    let table = document.getElementById("courseTable");
    table.innerHTML = "";

    courses.forEach((course, index) => {
        table.innerHTML += `
        <tr>
            <td>${course.id}</td>
            <td>${course.name}</td>
            <td>${course.teacher}</td>
            <td>
                <button class="delete"
                onclick="deleteCourse(${index})">
                Delete
                </button>
            </td>
        </tr>`;
    });

    document.getElementById("courseCount").innerText =
        courses.length;

    localStorage.setItem("courses", JSON.stringify(courses));
}

/* Add Course */
function addCourse() {
    let name = document.getElementById("courseName").value;
    let teacher = document.getElementById("teacher").value;

    if (name === "" || teacher === "") {
        alert("Please enter all details");
        return;
    }

    courses.push({
        id: courses.length + 1,
        name: name,
        teacher: teacher
    });

    document.getElementById("courseName").value = "";
    document.getElementById("teacher").value = "";

    displayCourses();
}

/* Delete Course */
function deleteCourse(index) {
    courses.splice(index, 1);

    courses.forEach((course, i) => {
        course.id = i + 1;
    });

    displayCourses();
}

/* Logout */
function logout() {
    document.getElementById("admin").style.display = "none";
    document.getElementById("login").style.display = "block";
}
</script>

</body>
</html>
