<!DOCTYPE html>
<html>
<head>
    <title>Class Selector Example</title>

    <style>
        .heading {
            color: blue;
            font-size: 25px;
        }

        .text {
            color: green;
        }
    </style>
</head>

<body>

    <h1 class="heading">Welcome to HTML</h1>

    <p class="text">This is the first paragraph.</p>
    <p class="text">This is the second paragraph.</p>

</body>
</html>
