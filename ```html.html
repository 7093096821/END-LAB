<!DOCTYPE html>
<html>
<head>
<title>E-Commerce Website</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: Arial; }
header, footer {
    background: #2c3e50;
    color: white;
    text-align: center;
    padding:   20px;
}
nav { background: #34495e; }
nav ul { display: flex; list-style: none; }
nav li { padding: 15px 20px; transition: 0.3s; }
nav li:hover { background: #4e6a85; }
nav a { color: white; text-decoration: none; }
main { padding: 20px; }
article {
    display: flex;
    align-items: center;
    gap: 20px;
    border: 1px solid #ccc;
    background: #f9f9f9;
    padding: 15px;
    margin-bottom: 15px;
    transition: 0.3s;
}
article:hover {
    transform: translateY(-4px);
    box-shadow: 0 6px 12px #ccc;
}
img {
    width: 150px;
    height: 120px;
    object-fit: contain;
}
button {
    background: green;
    color: white;
    border: none;
    padding: 8px 15px;
    margin-top: 10px;
    cursor: pointer;
    transition: 0.3s;
}
button:hover {
    background: darkgreen;
    transform: scale(1.05);
}
footer { margin-top: 20px; }
</style>
</head>
<body>

<header>
<h1>Durga Online Store</h1>
<p>Best Shopping Website</p>
</header>

<nav>
<ul>
<li><a href="#">Home</a></li>
<li><a href="#">Mobiles</a></li>
<li><a href="#">Laptops</a></li>
<li><a href="#">Accessories</a></li>
<li><a href="#">Contact</a></li>
</ul>
</nav>

<main>
<article>
<img src="smart.pjg.webp" alt="Smartphone">
<div>
<h2>Smart Phone</h2>
<p>Price: ₹20,000</p>
<button>Add to Cart</button>
</div>
</article>

<article>
<img src="laptop.pjg.avif" alt="Laptop">
<div>
<h2>Laptop</h2>
<p>Price: ₹55,000</p>
<button>Add to Cart</button>
</div>
</article>

<article>
<img src="head.pjg.jpg" alt="Headphones">
<div>
<h2>Headphones</h2>
<p>Price: ₹2,000</p>
<button>Add to Cart</button>
</div>
</article>
</main>

<footer>
<p>&copy; 2026 Durga Online Store | All Rights Reserved</p>
</footer>

</body>
</html>
