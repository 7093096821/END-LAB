<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KL University - Student Admission Form</title>

    <style>

        /* ==============================
           BASIC RESET
        ============================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #eff6ff, #e0f2fe);
            min-height: 100vh;
            padding: 30px 15px;

            animation: backgroundAnimation 8s infinite alternate;
        }

        /* ==============================
           BACKGROUND ANIMATION
        ============================== */

        @keyframes backgroundAnimation {

            0% {
                background-position: left;
            }

            100% {
                background-position: right;
            }
        }

        /* ==============================
           MAIN CONTAINER
        ============================== */

        .container {
            width: 100%;
            max-width: 1100px;
            margin: auto;
            background: white;
            border-radius: 20px;
            overflow: hidden;

            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.18);

            animation: formAppear 1s ease;
        }

        @keyframes formAppear {

            from {
                opacity: 0;
                transform: translateY(50px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ==============================
           HEADER
        ============================== */

        .header {
            background: linear-gradient(135deg, #003b73, #0074b7);
            color: white;
            text-align: center;
            padding: 35px 20px;

            animation: headerAnimation 1.2s ease;
        }

        @keyframes headerAnimation {

            from {
                opacity: 0;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .header h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .header h2 {
            font-size: 22px;
            font-weight: normal;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 15px;
        }

        /* ==============================
           FORM AREA
        ============================== */

        .form-container {
            padding: 35px;
        }

        .section-title {
            color: #003b73;
            font-size: 23px;
            margin-bottom: 20px;
            border-left: 5px solid #0074b7;
            padding-left: 12px;
        }

        /* ==============================
           CSS GRID
        ============================== */

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .form-group {
            display: flex;
            flex-direction: column;

            animation: fieldAnimation 0.8s ease;
        }

        @keyframes fieldAnimation {

            from {
                opacity: 0;
                transform: translateX(-20px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        label {
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px;
            border: 2px solid #d1d5db;
            border-radius: 10px;
            font-size: 15px;
            outline: none;

            transition: all 0.3s ease;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #0074b7;
            box-shadow: 0 0 10px rgba(0, 116, 183, 0.2);
            transform: translateY(-2px);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        /* ==============================
           GENDER RADIO BUTTONS
        ============================== */

        .gender-box {
            display: flex;
            gap: 25px;
            align-items: center;
            padding-top: 8px;
        }

        .gender-box label {
            font-weight: normal;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .gender-box input {
            width: auto;
        }

        /* ==============================
           BUTTON
        ============================== */

        .button-area {
            text-align: center;
            margin-top: 10px;
        }

        .submit-btn {
            background: linear-gradient(135deg, #003b73, #0074b7);
            color: white;
            border: none;
            padding: 15px 45px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;

            transition: all 0.3s ease;

            animation: buttonPulse 2s infinite;
        }

        .submit-btn:hover {
            transform: scale(1.08) translateY(-3px);
            background: linear-gradient(135deg, #0074b7, #00a6fb);
        }

        @keyframes buttonPulse {

            0% {
                box-shadow: 0 0 0 0 rgba(0, 116, 183, 0.5);
            }

            70% {
                box-shadow: 0 0 0 15px rgba(0, 116, 183, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(0, 116, 183, 0);
            }
        }

        /* ==============================
           FOOTER
        ============================== */

        .footer {
            background: #003b73;
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 14px;
        }

        /* ==============================
           TABLET RESPONSIVE
        ============================== */

        @media (max-width: 768px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: auto;
            }

            .header h1 {
                font-size: 30px;
            }

            .header h2 {
                font-size: 19px;
            }

            .form-container {
                padding: 25px;
            }
        }

        /* ==============================
           MOBILE RESPONSIVE
        ============================== */

        @media (max-width: 480px) {

            body {
                padding: 10px;
            }

            .container {
                border-radius: 12px;
            }

            .header {
                padding: 25px 15px;
            }

            .header h1 {
                font-size: 25px;
            }

            .header h2 {
                font-size: 17px;
            }

            .header p {
                font-size: 13px;
            }

            .form-container {
                padding: 20px 15px;
            }

            .section-title {
                font-size: 20px;
            }

            input,
            select,
            textarea {
                padding: 11px;
                font-size: 14px;
            }

            .gender-box {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .submit-btn {
                width: 100%;
                padding: 13px;
            }
        }

    </style>
</head>

<body>

    <div class="container">

        <!-- ==============================
             HEADER
        ============================== -->

        <div class="header">

            <h1>KL UNIVERSITY</h1>

            <h2>Student Admission Form</h2>

            <p>
                Koneru Lakshmaiah Education Foundation
            </p>

        </div>


        <!-- ==============================
             FORM
        ============================== -->

        <div class="form-container">

            <h3 class="section-title">
                Personal Information
            </h3>

            <div class="form-grid">

                <div class="form-group">

                    <label for="fname">
                        First Name
                    </label>

                    <input
                        type="text"
                        id="fname"
                        placeholder="Enter first name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="lname">
                        Last Name
                    </label>

                    <input
                        type="text"
                        id="lname"
                        placeholder="Enter last name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="dob">
                        Date of Birth
                    </label>

                    <input
                        type="date"
                        id="dob"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Gender
                    </label>

                    <div class="gender-box">

                        <label>
                            <input type="radio" name="gender">
                            Male
                        </label>

                        <label>
                            <input type="radio" name="gender">
                            Female
                        </label>

                        <label>
                            <input type="radio" name="gender">
                            Other
                        </label>

                    </div>

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter email address"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="phone">
                        Mobile Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter mobile number"
                        required
                    >

                </div>


                <!-- FULL WIDTH -->

                <div class="form-group full-width">

                    <label for="address">
                        Address
                    </label>

                    <textarea
                        id="address"
                        placeholder="Enter your complete address"
                    ></textarea>

                </div>

            </div>


            <!-- ==============================
                 ACADEMIC INFORMATION
            ============================== -->

            <h3 class="section-title">
                Academic Information
            </h3>

            <div class="form-grid">

                <div class="form-group">

                    <label for="qualification">
                        Previous Qualification
                    </label>

                    <select id="qualification">

                        <option value="">
                            Select Qualification
                        </option>

                        <option>
                            Intermediate
                        </option>

                        <option>
                            Diploma
                        </option>

                        <option>
                            Other
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="percentage">
                        Percentage / CGPA
                    </label>

                    <input
                        type="text"
                        id="percentage"
                        placeholder="Enter percentage or CGPA"
                    >

                </div>


                <div class="form-group">

                    <label for="course">
                        Select Course
                    </label>

                    <select id="course">

                        <option value="">
                            Select Course
                        </option>

                        <option>
                            B.Tech - Computer Science
                        </option>

                        <option>
                            B.Tech - Information Technology
                        </option>

                        <option>
                            B.Tech - Electronics and Communication
                        </option>

                        <option>
                            B.Tech - Electrical and Electronics
                        </option>

                        <option>
                            B.Tech - Mechanical Engineering
                        </option>

                        <option>
                            BBA
                        </option>

                        <option>
                            BCA
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="year">
                        Admission Year
                    </label>

                    <select id="year">

                        <option value="">
                            Select Year
                        </option>

                        <option>
                            2026
                        </option>

                        <option>
                            2027
                        </option>

                        <option>
                            2028
                        </option>

                    </select>

                </div>


                <div class="form-group full-width">

                    <label for="college">
                        Previous School / College Name
                    </label>

                    <input
                        type="text"
                        id="college"
                        placeholder="Enter school or college name"
                    >

                </div>

            </div>


            <!-- ==============================
                 PARENT / GUARDIAN
            ============================== -->

            <h3 class="section-title">
                Parent / Guardian Information
            </h3>

            <div class="form-grid">

                <div class="form-group">

                    <label for="parent">
                        Parent / Guardian Name
                    </label>

                    <input
                        type="text"
                        id="parent"
                        placeholder="Enter parent name"
                    >

                </div>


                <div class="form-group">

                    <label for="parentphone">
                        Parent Mobile Number
                    </label>

                    <input
                        type="tel"
                        id="parentphone"
                        placeholder="Enter parent mobile number"
                    >

                </div>


                <div class="form-group full-width">

                    <label for="parentemail">
                        Parent Email
                    </label>

                    <input
                        type="email"
                        id="parentemail"
                        placeholder="Enter parent email"
                    >

                </div>

            </div>


            <!-- ==============================
                 SUBMIT
            ============================== -->

            <div class="button-area">

                <button
                    class="submit-btn"
                    onclick="submitForm()"
                >
                    Submit Application
                </button>

            </div>

        </div>


        <!-- ==============================
             FOOTER
        ============================== -->

        <div class="footer">

            <p>
                © 2026 KL University | Student Admission Portal
            </p>

        </div>

    </div>


    <!-- ==============================
         JAVASCRIPT
    ============================== -->

    <script>

        function submitForm() {

            alert(
                "Your KL University admission application has been submitted successfully!"
            );

        }

    </script>

</body>
</html>
