<!DOCTYPE html>
<html>
<head>
    <title>Student Grade Calculator</title>
</head>
 
<body>
 
    <h2>Student Grade Calculator</h2>
 
    <label>Student Name:</label>
    <input type="text" id="studentName" placeholder="Enter student name">
    <br><br>
 
    <label>Subject 1:</label>
    <input type="number" id="mark1">
    <br><br>
 
    <label>Subject 2:</label>
    <input type="number" id="mark2">
    <br><br>
 
    <label>Subject 3:</label>
    <input type="number" id="mark3">
    <br><br>
 
    <button onclick="calculateResult()">Calculate Result</button>
            
    <h3 id="result"></h3>
 
    <script>
 
        function calculateTotal(a, b, c) {
            return a + b + c;
        }
 
        function calculateAverage(total) {
            return total / 3;
        }
 
        function calculateGrade(average) {
            if (average >= 90)
                return "A+";
            else if (average >= 80)
                return "A";
            else if (average >= 70)
                return "B";
            else if (average >= 60)
                return "C";
            else if (average >= 50)
                return "D";
            else
                return "F";
        }
 
        function calculateResult() {
 
            // Get student name
            let name = document.getElementById("studentName").value;
 
            // Get marks
            let mark1 = Number(document.getElementById("mark1").value);
            let mark2 = Number(document.getElementById("mark2").value);
            let mark3 = Number(document.getElementById("mark3").value);
 
            // Call functions
            let total = calculateTotal(mark1, mark2, mark3);
            let average = calculateAverage(total);
            let grade = calculateGrade(average);
 
            // Display result
            document.getElementById("result").innerHTML =
                "Student Name: " + name + "<br>" +
                "Total Marks: " + total + "<br>" +
                "Average: " + average.toFixed(2) + "<br>" +
                "Grade: " + grade;
        }
 
    </script>
 
</body>
</html>
